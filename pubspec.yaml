name: movie_explorer

description: A Flutter Movie Explorer application using TMDB API.

publish_to: "none"


# Version of your application
version: 1.0.0+1



environment:

  sdk: ^3.12.0

  flutter: ">=3.24.0"



dependencies:

  flutter:
    sdk: flutter




  # State Management
  provider: ^6.1.2


  # REST API
  http: ^1.2.2


  # Load movie posters/images efficiently
  cached_network_image: ^3.4.1


  # Local storage for favorites
  shared_preferences: ^2.3.3


  # Open YouTube trailer links
  url_launcher: ^6.3.1



  # Cupertino icons
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.1




dev_dependencies:

  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0




flutter:

  uses-material-design: true



  # Assets will be added later if needed
  # assets:
  #   - assets/images/